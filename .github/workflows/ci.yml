name: CI / Publish

permissions:
  contents: write
  checks: write
  pull-requests: write
  packages: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      force-publish:
        description: 'Publish regardless of the current branch'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  package:
    name: CI/CD
    uses: GravionLabs/ci/.github/workflows/node-package.yml@main
    with:
      node-version: ${{ vars.NODE_VERSION || '24' }}
      package-manager: pnpm
      lint-command: pnpm check
      build-command: pnpm -r build
      run-tests: true
      test-command: pnpm -r test:ci
      coverage-format: cobertura
      set-version-command: |
        for pkg in packages/*/package.json; do
          if ! grep -q '"private": true' "$pkg"; then
            node -e "
              const p = require('./$pkg');
              p.version = process.env.VERSION;
              require('fs').writeFileSync('./$pkg', JSON.stringify(p, null, 2) + '\n');
            "
          fi
        done
      publish-command: pnpm publish -r --no-git-checks
      force-publish: ${{ github.event_name == 'workflow_dispatch' && inputs.force-publish == 'true' || false }}
    secrets:
      npm-token: ${{ secrets.GH_PAT }}
