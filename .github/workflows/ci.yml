name: CI + Publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force-publish:
        description: 'Publish packages even on non-main branches'
        type: boolean
        required: false
        default: false

jobs:
  package:
    name: CI/CD
    uses: GravionLabs/ci/.github/workflows/node-package.yml@main
    with:
      node-version: '24'
      package-manager: pnpm
      build-command: pnpm -r build
      test-command: pnpm -r test:ci
      set-version-command: |
        for pkg in packages/*/package.json; do
          if ! grep -q '"private": true' "$pkg"; then
            node -e "
              const p = require('./$pkg');
              p.version = process.env.VERSION;
              require('fs').writeFileSync('./$pkg', JSON.stringify(p, null, 2) + '\n');
            "
          fi
        done
      publish-command: pnpm publish -r --no-git-checks
      force-publish: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force-publish == 'true' || false }}
    secrets:
      npm-token: ${{ secrets.GH_PAT }}
