name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish (all = both types + caveman-compress)
        required: true
        default: all
        type: choice
        options:
          - all
          - '@kontex/types'
          - '@kontex/caveman-compress'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - name: Publish @kontex/types
        if: inputs.package == 'all' || inputs.package == '@kontex/types'
        run: pnpm --filter @kontex/types publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @kontex/caveman-compress
        if: inputs.package == 'all' || inputs.package == '@kontex/caveman-compress'
        run: pnpm --filter @kontex/caveman-compress publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
